version: '3.8'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  server:
    build: ./server
    env_file: ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    volumes:
      - ./server/uploads:/app/uploads
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  mongo_data:
